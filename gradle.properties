# Gradle's default daemon heap is 512 MB, which is too small for this build (Kotlin patches,
# Android library modules, R8 and the media3 shadow jar) and causes long GC pauses.
# The Kotlin daemon inherits these arguments. Lower -Xmx if the machine has little RAM.
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
kotlin.code.style = official
android.useAndroidX = true
version = 1.8.16
